name: Auto Update Profile README

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Latest Repos and Update README
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python - << 'EOF'
          import urllib.request
          import json
          import os
          import re

          username = os.environ.get('GITHUB_USERNAME')
          print(f"🔍 Fetching repos for user: {username}...")
          
          # Fetch top 10 most recently pushed public repos
          url = f"https://api.github.com/users/{username}/repos?sort=pushed&direction=desc&per_page=10"

          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req) as response:
              repos = json.loads(response.read().decode())

          print(f"📦 Total repos fetched from API: {len(repos)}")

          table_header = "| 🤖 Project | 💻 Primary Language | 📅 Last Updated |\n|:---|:---:|:---:|"
          rows = []
          count = 0
          for repo in repos:
              # Skip profile repository and forks
              if repo['name'].lower() != username.lower() and not repo['fork']:
                  name = repo['name'].replace('-', ' ').title()
                  url = repo['html_url']
                  lang = repo['language'] or "Python / AI"
                  pushed_at = repo['pushed_at'].split("T")[0]
                  rows.append(f"| [🤖 {name}]({url}) | `{lang}` | `{pushed_at}` |")
                  print(f"  -> Added: {name} (Pushed: {pushed_at})")
                  count += 1
                  if count >= 5:
                      break

          new_table = table_header + "\n" + "\n".join(rows)

          # Read README.md
          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          start_marker = "<!-- REPOSITORY_LIST_START -->"
          end_marker = "<!-- REPOSITORY_LIST_END -->"

          if start_marker not in content or end_marker not in content:
              print(f"❌ ERROR: Could not find '{start_marker}' or '{end_marker}' in README.md!")
          else:
              print("✅ Found markers in README.md! Replacing content...")
              pattern = r"(<!-- REPOSITORY_LIST_START -->)(.*?)(<!-- REPOSITORY_LIST_END -->)"
              updated_content = re.sub(
                  pattern,
                  f"\\1\n{new_table}\n\\3",
                  content,
                  flags=re.DOTALL
              )

              if updated_content == content:
                  print("⚠️ No visual changes detected in README.md (content is already exact match).")
              else:
                  print("📝 Writing changes to README.md...")
                  with open("README.md", "w", encoding="utf-8") as f:
                      f.write(updated_content)
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet || git commit -m "chore: auto-update portfolio projects [skip ci]"
          git push
