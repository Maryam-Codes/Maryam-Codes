<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="50%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="33%" stop-color="#c026d3"/>
      <stop offset="66%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-0.5 0" to="0.5 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scanLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="45%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="55%" stop-color="transparent"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="codeCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f0ff"/>
      <stop offset="100%" stop-color="#ede5ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="neonGlow"><feGaussianBlur stdDeviation="4" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="bannerClip"><rect x="0" y="0" width="1280" height="740" rx="16"/></clipPath>
  </defs>
  <style>
    @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
    .cursor{animation:blink 1s step-end infinite}
    @keyframes letterIn{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:translateY(0)}}
    .name-letter{opacity:0;animation:letterIn 0.3s ease both}
    .nl1{animation-delay:1.0s}.nl2{animation-delay:1.1s}.nl3{animation-delay:1.2s}
    .nl4{animation-delay:1.3s}.nl5{animation-delay:1.4s}.nl6{animation-delay:1.5s}
    .nl7{animation-delay:1.6s}.nl8{animation-delay:1.7s}.nl9{animation-delay:1.8s}
    .nl10{animation-delay:1.9s}
    @keyframes role1{0%,20%{opacity:1}22%,100%{opacity:0}}
    @keyframes role2{0%,24%{opacity:0}26%,46%{opacity:1}48%,100%{opacity:0}}
    @keyframes role3{0%,50%{opacity:0}52%,72%{opacity:1}74%,100%{opacity:0}}
    @keyframes role4{0%,76%{opacity:0}78%,98%{opacity:1}100%{opacity:0}}
    .role1{animation:role1 12s linear 2.5s infinite}
    .role2{opacity:0;animation:role2 12s linear 2.5s infinite}
    .role3{opacity:0;animation:role3 12s linear 2.5s infinite}
    .role4{opacity:0;animation:role4 12s linear 2.5s infinite}
    @keyframes pillIn{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}
    .pill{opacity:0;animation:pillIn 0.4s ease both}
    .p1{animation-delay:2.8s}.p2{animation-delay:2.95s}.p3{animation-delay:3.1s}
    .p4{animation-delay:3.25s}.p5{animation-delay:3.4s}.p6{animation-delay:3.55s}
    .p7{animation-delay:3.7s}.p8{animation-delay:3.85s}
    @keyframes codeLine{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
    .code-line{opacity:0;animation:codeLine 0.4s ease both}
    .cl1{animation-delay:4.0s}.cl2{animation-delay:4.4s}.cl3{animation-delay:4.8s}
    .cl4{animation-delay:5.2s}.cl5{animation-delay:5.6s}.cl6{animation-delay:6.0s}
    .cl7{animation-delay:6.4s}
    @keyframes neonFlicker{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:0.3}}
    .neon{opacity:0;animation:pillIn 0.3s ease 6.5s both}
    .neon-text{animation:neonFlicker 3s ease 7s infinite}
    @keyframes sparkle{0%,100%{opacity:0.1;transform:scale(0.5)}50%{opacity:0.5;transform:scale(1.2)}}
    .sparkle{animation:sparkle 2s ease infinite}
    @keyframes scan{from{transform:translateY(-50px)}to{transform:translateY(790px)}}
    .scanner{animation:scan 3.5s linear infinite}
    @keyframes aboutIn{from{opacity:0;transform:translateX(-15px)}to{opacity:1;transform:translateX(0)}}
    .about{opacity:0;animation:aboutIn 0.4s ease both}
    .a1{animation-delay:2.2s}.a2{animation-delay:2.4s}.a3{animation-delay:2.6s}
    @keyframes quoteIn{from{opacity:0}to{opacity:1}}
    .quote{opacity:0;animation:quoteIn 0.5s ease 3.0s both}
    @keyframes barGrow{from{width:0}to{width:310px}}
    .stat-bar{animation:barGrow 1s ease 3.5s both}
    @keyframes orbPulse{0%,100%{opacity:0.06}50%{opacity:0.12}}
    .orb{animation:orbPulse 5s ease infinite}
  </style>

  <g clip-path="url(#bannerClip)">
    <rect width="1280" height="740" fill="url(#bg)"/>
    <circle class="orb" cx="200" cy="600" r="70" fill="#a855f7" opacity="0.06"/>
    <circle class="orb" cx="1100" cy="150" r="60" fill="#c026d3" opacity="0.06" style="animation-delay:2s"/>
    <g opacity="0.04">
      <line x1="0" y1="100" x2="1280" y2="100" stroke="#a855f7" stroke-width="0.5"/>
      <line x1="0" y1="200" x2="1280" y2="200" stroke="#a855f7" stroke-width="0.5"/>
      <line x1="0" y1="300" x2="1280" y2="300" stroke="#a855f7" stroke-width="0.5"/>
      <line x1="0" y1="400" x2="1280" y2="400" stroke="#a855f7" stroke-width="0.5"/>
      <line x1="0" y1="500" x2="1280" y2="500" stroke="#a855f7" stroke-width="0.5"/>
      <line x1="0" y1="600" x2="1280" y2="600" stroke="#a855f7" stroke-width="0.5"/>
      <line x1="200" y1="0" x2="200" y2="740" stroke="#a855f7" stroke-width="0.5"/>
      <line x1="400" y1="0" x2="400" y2="740" stroke="#a855f7" stroke-width="0.5"/>
      <line x1="600" y1="0" x2="600" y2="740" stroke="#a855f7" stroke-width="0.5"/>
      <line x1="800" y1="0" x2="800" y2="740" stroke="#a855f7" stroke-width="0.5"/>
      <line x1="1000" y1="0" x2="1000" y2="740" stroke="#a855f7" stroke-width="0.5"/>
    </g>

    <!-- Terminal -->
    <g transform="translate(50,30)">
      <rect width="500" height="45" rx="8" fill="#f5f0ff" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.4"/>
      <circle cx="18" cy="22" r="5" fill="#ef4444"/><circle cx="36" cy="22" r="5" fill="#eab308"/><circle cx="54" cy="22" r="5" fill="#22c55e"/>
      <text x="75" y="28" font-family="'Courier New',monospace" font-size="15" font-weight="500">
        <tspan fill="#16a34a">user@automation</tspan><tspan fill="#7c3aed">:</tspan><tspan fill="#4f46e5">~</tspan><tspan fill="#7c3aed">$ </tspan><tspan fill="#1e1b4b">cat README.md</tspan>
      </text>
      <rect class="cursor" x="400" y="14" width="10" height="18" fill="#7c3aed"/>
    </g>

    <!-- Name -->
    <g transform="translate(50,130)">
      <text font-family="'Segoe UI','Helvetica Neue',sans-serif" font-size="58" font-weight="800" fill="url(#nameGrad)" filter="url(#glow)">
        <tspan class="name-letter nl1">M</tspan><tspan class="name-letter nl2">a</tspan><tspan class="name-letter nl3">r</tspan><tspan class="name-letter nl4">y</tspan><tspan class="name-letter nl5">a</tspan><tspan class="name-letter nl6">m</tspan><tspan class="name-letter nl7" dx="15">I</tspan><tspan class="name-letter nl8">j</tspan><tspan class="name-letter nl9">a</tspan><tspan class="name-letter nl10">z</tspan>
      </text>
    </g>

    <!-- Roles -->
    <g transform="translate(50,170)">
      <text class="role1" fill="#9333ea" font-family="'Courier New',monospace" font-size="20" font-weight="500">▹ AI Automation Engineer</text>
      <text class="role2" fill="#7c3aed" font-family="'Courier New',monospace" font-size="20" font-weight="500">▹ Workflow Architect</text>
      <text class="role3" fill="#a855f7" font-family="'Courier New',monospace" font-size="20" font-weight="500">▹ AI Agent Builder</text>
      <text class="role4" fill="#c026d3" font-family="'Courier New',monospace" font-size="20" font-weight="500">▹ API Integration Specialist</text>
    </g>

    <!-- About -->
    <g transform="translate(50,220)">
      <text class="about a1" fill="#6b21a8" font-family="'Segoe UI',sans-serif" font-size="14"><tspan fill="#9333ea">📍</tspan> Based in Lahore / Islamabad, Pakistan</text>
      <text class="about a2" y="25" fill="#6b21a8" font-family="'Segoe UI',sans-serif" font-size="14"><tspan fill="#9333ea">🎓</tspan> BS Computer Science — Superior University</text>
      <text class="about a3" y="50" fill="#6b21a8" font-family="'Segoe UI',sans-serif" font-size="14"><tspan fill="#9333ea">🏢</tspan> AI Engineer at Nexsol Developers</text>
    </g>

    <!-- Quote -->
    <g class="quote" transform="translate(50,310)">
      <rect width="380" height="40" rx="8" fill="#f0e5ff" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="15" y="26" fill="#6b21a8" font-family="'Segoe UI',sans-serif" font-size="14" font-style="italic">💜 "My workflows run while the world sleeps. ☕"</text>
    </g>

    <!-- Tech pills -->
    <g transform="translate(50,380)"><text fill="#7c3aed" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" letter-spacing="2">TECH STACK</text></g>
    <g transform="translate(50,400)">
      <g class="pill p1"><rect width="55" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-width="0.8"/><text x="27" y="17" text-anchor="middle" fill="#7c3aed" font-family="'Segoe UI',sans-serif" font-size="11">n8n</text></g>
      <g class="pill p2" transform="translate(65,0)"><rect width="70" height="26" rx="13" fill="#c026d3" fill-opacity="0.1" stroke="#c026d3" stroke-width="0.8"/><text x="35" y="17" text-anchor="middle" fill="#a21caf" font-family="'Segoe UI',sans-serif" font-size="11">Python</text></g>
      <g class="pill p3" transform="translate(145,0)"><rect width="72" height="26" rx="13" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-width="0.8"/><text x="36" y="17" text-anchor="middle" fill="#7c3aed" font-family="'Segoe UI',sans-serif" font-size="11">OpenAI</text></g>
      <g class="pill p4" transform="translate(227,0)"><rect width="90" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-width="0.8"/><text x="45" y="17" text-anchor="middle" fill="#6d28d9" font-family="'Segoe UI',sans-serif" font-size="11">LangChain</text></g>
      <g class="pill p5" transform="translate(0,35)"><rect width="68" height="26" rx="13" fill="#c026d3" fill-opacity="0.1" stroke="#c026d3" stroke-width="0.8"/><text x="34" y="17" text-anchor="middle" fill="#a21caf" font-family="'Segoe UI',sans-serif" font-size="11">Docker</text></g>
      <g class="pill p6" transform="translate(78,35)"><rect width="80" height="26" rx="13" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-width="0.8"/><text x="40" y="17" text-anchor="middle" fill="#7c3aed" font-family="'Segoe UI',sans-serif" font-size="11">REST APIs</text></g>
      <g class="pill p7" transform="translate(168,35)"><rect width="80" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-width="0.8"/><text x="40" y="17" text-anchor="middle" fill="#6d28d9" font-family="'Segoe UI',sans-serif" font-size="11">Make.com</text></g>
      <g class="pill p8" transform="translate(258,35)"><rect width="72" height="26" rx="13" fill="#c026d3" fill-opacity="0.1" stroke="#c026d3" stroke-width="0.8"/><text x="36" y="17" text-anchor="middle" fill="#a21caf" font-family="'Segoe UI',sans-serif" font-size="11">FastAPI</text></g>
    </g>

    <!-- Stats bar -->
    <g transform="translate(50,490)">
      <text fill="#7c3aed" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" letter-spacing="2">AUTOMATION LEVEL</text>
      <rect y="18" width="340" height="8" rx="4" fill="#e9d5ff"/>
      <rect class="stat-bar" y="18" height="8" rx="4" fill="url(#neonGrad)"/>
      <text x="350" y="27" fill="#7c3aed" font-family="'Segoe UI',sans-serif" font-size="11" font-weight="600">92%</text>
    </g>

    <!-- Code card -->
    <g transform="translate(700,100)">
      <rect width="520" height="280" rx="12" fill="url(#codeCardGrad)" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.3"/>
      <rect width="520" height="32" rx="12 12 0 0" fill="#e9d5ff"/>
      <circle cx="18" cy="16" r="5" fill="#ef4444"/><circle cx="36" cy="16" r="5" fill="#eab308"/><circle cx="54" cy="16" r="5" fill="#22c55e"/>
      <text x="260" y="20" text-anchor="middle" fill="#6b21a8" font-family="'Courier New',monospace" font-size="11">automate.py</text>
      <text class="code-line cl1" x="20" y="60" font-family="'Courier New',monospace" font-size="14"><tspan fill="#7c3aed">import</tspan><tspan fill="#1e1b4b"> n8n, openai, langchain</tspan></text>
      <text class="code-line cl2" x="20" y="85" font-family="'Courier New',monospace" font-size="14"><tspan fill="#1e1b4b"> </tspan></text>
      <text class="code-line cl3" x="20" y="110" font-family="'Courier New',monospace" font-size="14"><tspan fill="#6d28d9">def</tspan><tspan fill="#a21caf"> automate_everything</tspan><tspan fill="#1e1b4b">():</tspan></text>
      <text class="code-line cl4" x="20" y="135" font-family="'Courier New',monospace" font-size="14"><tspan fill="#1e1b4b">    workflows = </tspan><tspan fill="#16a34a">"infinite"</tspan></text>
      <text class="code-line cl5" x="20" y="160" font-family="'Courier New',monospace" font-size="14"><tspan fill="#1e1b4b">    coffee = </tspan><tspan fill="#16a34a">"always_brewing"</tspan></text>
      <text class="code-line cl6" x="20" y="185" font-family="'Courier New',monospace" font-size="14"><tspan fill="#7c3aed">    while</tspan><tspan fill="#1e1b4b"> coffee:</tspan></text>
      <text class="code-line cl7" x="20" y="210" font-family="'Courier New',monospace" font-size="14"><tspan fill="#1e1b4b">        build(</tspan><tspan fill="#16a34a">"AI agents"</tspan><tspan fill="#1e1b4b">)</tspan></text>
      <rect class="cursor" x="350" y="196" width="9" height="16" fill="#7c3aed" style="animation-delay:0.5s"/>
    </g>

    <!-- Avatar placeholder -->
    <g transform="translate(740,420)">
      <rect width="200" height="240" rx="16" fill="#f0e5ff" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3"/>
      <text x="100" y="115" text-anchor="middle" fill="#7c3aed" font-family="'Segoe UI',sans-serif" font-size="13" opacity="0.5">Your Character</text>
      <text x="100" y="135" text-anchor="middle" fill="#7c3aed" font-family="'Segoe UI',sans-serif" font-size="13" opacity="0.5">Image Here</text>
      <rect width="200" height="240" rx="16" fill="url(#scanLine)" opacity="0.3">
        <animateTransform attributeName="transform" type="translate" from="0 -240" to="0 240" dur="3.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Neon sign -->
    <g class="neon" transform="translate(50,570)">
      <rect width="380" height="50" rx="8" fill="transparent" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.2"/>
      <text class="neon-text" x="190" y="32" text-anchor="middle" fill="url(#neonGrad)" font-family="'Segoe UI',sans-serif" font-size="22" font-weight="800" letter-spacing="4" filter="url(#neonGlow)">⚡ AUTOMATE EVERYTHING ⚡</text>
    </g>

    <!-- Sparkles -->
    <circle class="sparkle" cx="620" cy="50" r="2" fill="#a855f7"/>
    <circle class="sparkle" cx="1200" cy="400" r="1.5" fill="#c026d3" style="animation-delay:0.7s"/>
    <circle class="sparkle" cx="680" cy="680" r="1.5" fill="#7c3aed" style="animation-delay:1.4s"/>
    <circle class="sparkle" cx="450" cy="550" r="2" fill="#a855f7" style="animation-delay:0.3s"/>

    <!-- Scanner -->
    <g class="scanner" opacity="0.2">
      <rect x="0" y="0" width="1280" height="2" fill="#a855f7" rx="1">
        <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="0" y="0" width="1280" height="740" rx="16" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.15"/>
    <g transform="translate(50,700)">
      <text fill="#7c3aed" font-family="'Segoe UI',sans-serif" font-size="11" opacity="0.4">github.com/Maryam-Codes  •  maryamijazrana@gmail.com  •  Built with 💜</text>
    </g>
  </g>
</svg>
