<svg xmlns="http://www.w3.org/2000/svg" width="820" height="130" viewBox="0 0 820 130">
  <defs>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="45%" stop-color="transparent"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="55%" stop-color="transparent"/>
      <stop offset="100%" stop-color="transparent"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    @keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
    .trophy{transform-origin:center;animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both}
    .t1{animation-delay:0.2s}.t2{animation-delay:0.35s}.t3{animation-delay:0.5s}
    .t4{animation-delay:0.65s}.t5{animation-delay:0.8s}.t6{animation-delay:0.95s}
  </style>
  <!-- Card bg -->
  <rect x="0.5" y="0.5" width="819" height="129" rx="10" fill="#170e28" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Trophy 1: Stars -->
  <g class="trophy t1" transform="translate(20,10)">
    <rect width="115" height="110" rx="8" fill="#1e0a38" stroke="#c084fc" stroke-width="1" stroke-opacity="0.3"/>
    <rect width="115" height="110" rx="8" fill="url(#shine)"/>
    <text x="57" y="40" text-anchor="middle" font-size="28">⭐</text>
    <text x="57" y="65" text-anchor="middle" fill="#c084fc" font-family="'Segoe UI',sans-serif" font-weight="600" font-size="11">Stars</text>
    <text x="57" y="85" text-anchor="middle" fill="#e879f9" font-family="'Segoe UI',sans-serif" font-weight="700" font-size="14" filter="url(#glow)">A+</text>
    <text x="57" y="100" text-anchor="middle" fill="#b794d4" font-family="'Segoe UI',sans-serif" font-size="9">12 earned</text>
  </g>
  <!-- Trophy 2: Commits -->
  <g class="trophy t2" transform="translate(155,10)">
    <rect width="115" height="110" rx="8" fill="#1e0a38" stroke="#e879f9" stroke-width="1" stroke-opacity="0.3"/>
    <rect width="115" height="110" rx="8" fill="url(#shine)"/>
    <text x="57" y="40" text-anchor="middle" font-size="28">🔥</text>
    <text x="57" y="65" text-anchor="middle" fill="#e879f9" font-family="'Segoe UI',sans-serif" font-weight="600" font-size="11">Commits</text>
    <text x="57" y="85" text-anchor="middle" fill="#c084fc" font-family="'Segoe UI',sans-serif" font-weight="700" font-size="14" filter="url(#glow)">A+</text>
    <text x="57" y="100" text-anchor="middle" fill="#b794d4" font-family="'Segoe UI',sans-serif" font-size="9">247 total</text>
  </g>
  <!-- Trophy 3: PRs -->
  <g class="trophy t3" transform="translate(290,10)">
    <rect width="115" height="110" rx="8" fill="#1e0a38" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3"/>
    <rect width="115" height="110" rx="8" fill="url(#shine)"/>
    <text x="57" y="40" text-anchor="middle" font-size="28">🔀</text>
    <text x="57" y="65" text-anchor="middle" fill="#8b5cf6" font-family="'Segoe UI',sans-serif" font-weight="600" font-size="11">Pull Requests</text>
    <text x="57" y="85" text-anchor="middle" fill="#e879f9" font-family="'Segoe UI',sans-serif" font-weight="700" font-size="14" filter="url(#glow)">A</text>
    <text x="57" y="100" text-anchor="middle" fill="#b794d4" font-family="'Segoe UI',sans-serif" font-size="9">18 merged</text>
  </g>
  <!-- Trophy 4: Issues -->
  <g class="trophy t4" transform="translate(425,10)">
    <rect width="115" height="110" rx="8" fill="#1e0a38" stroke="#d8b4fe" stroke-width="1" stroke-opacity="0.3"/>
    <rect width="115" height="110" rx="8" fill="url(#shine)"/>
    <text x="57" y="40" text-anchor="middle" font-size="28">📋</text>
    <text x="57" y="65" text-anchor="middle" fill="#d8b4fe" font-family="'Segoe UI',sans-serif" font-weight="600" font-size="11">Issues</text>
    <text x="57" y="85" text-anchor="middle" fill="#c084fc" font-family="'Segoe UI',sans-serif" font-weight="700" font-size="14" filter="url(#glow)">B+</text>
    <text x="57" y="100" text-anchor="middle" fill="#b794d4" font-family="'Segoe UI',sans-serif" font-size="9">5 opened</text>
  </g>
  <!-- Trophy 5: Repos -->
  <g class="trophy t5" transform="translate(560,10)">
    <rect width="115" height="110" rx="8" fill="#1e0a38" stroke="#f0abfc" stroke-width="1" stroke-opacity="0.3"/>
    <rect width="115" height="110" rx="8" fill="url(#shine)"/>
    <text x="57" y="40" text-anchor="middle" font-size="28">📁</text>
    <text x="57" y="65" text-anchor="middle" fill="#f0abfc" font-family="'Segoe UI',sans-serif" font-weight="600" font-size="11">Repositories</text>
    <text x="57" y="85" text-anchor="middle" fill="#e879f9" font-family="'Segoe UI',sans-serif" font-weight="700" font-size="14" filter="url(#glow)">A</text>
    <text x="57" y="100" text-anchor="middle" fill="#b794d4" font-family="'Segoe UI',sans-serif" font-size="9">10+ repos</text>
  </g>
  <!-- Trophy 6: Followers -->
  <g class="trophy t6" transform="translate(695,10)">
    <rect width="115" height="110" rx="8" fill="#1e0a38" stroke="#c084fc" stroke-width="1" stroke-opacity="0.3"/>
    <rect width="115" height="110" rx="8" fill="url(#shine)"/>
    <text x="57" y="40" text-anchor="middle" font-size="28">👥</text>
    <text x="57" y="65" text-anchor="middle" fill="#c084fc" font-family="'Segoe UI',sans-serif" font-weight="600" font-size="11">Followers</text>
    <text x="57" y="85" text-anchor="middle" fill="#c084fc" font-family="'Segoe UI',sans-serif" font-weight="700" font-size="14" filter="url(#glow)">B+</text>
    <text x="57" y="100" text-anchor="middle" fill="#b794d4" font-family="'Segoe UI',sans-serif" font-size="9">Growing!</text>
  </g>
</svg>
